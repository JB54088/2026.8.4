<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>刷题面板预览</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="main">
    <header class="top">
      <div>
        <p id="sub">预览同学 · 数学二 · 强化阶段</p>
        <h1>刷题</h1>
      </div>
    </header>
    <section class="panel question-top">
      <p>
        <span class="badge">综合提升</span>
        <span class="badge warn">4星 综合</span>
        <span class="badge">历年考研数学真题</span>
        一元函数积分学 · 换元积分 · 第 1/20 题
      </p>
      <h2>设函数 f(x)=∫(0,x) t·e^(t²) dt，求 f'(x) 并判断本题应优先使用的基本方法。</h2>
      <div class="option-strip">
        <span>A. 直接求导并使用变上限积分公式</span>
        <span>B. 先分部积分再求导</span>
        <span>C. 先展开 e^(t²) 再逐项积分</span>
        <span>D. 使用二阶导数判别</span>
      </div>
    </section>
    <section class="panel choice-panel">
      <div class="scratch-head">
        <div>
          <h3>选择题作答</h3>
          <p>选择题直接点击上方选项提交，不强制出现草稿板；需要演算时可打开草稿。</p>
        </div>
        <div class="row">
          <button class="ghost">打开草稿</button>
          <button class="ghost">上一题</button>
          <button class="ghost">下一题</button>
          <button class="ghost">刷新新题</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
