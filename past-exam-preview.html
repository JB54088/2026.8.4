<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>真题分类概率 · 原页预览</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d9e2ec;
      --paper: #ffffff;
      --canvas: #f4f7fb;
      --accent: #1769aa;
      --accent-soft: #e8f2fb;
      --danger: #b42318;
      --danger-soft: #fff1f0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      line-height: 1.6;
    }

    button,
    input {
      font: inherit;
    }

    button,
    .back-link,
    .image-link {
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--paper);
      cursor: pointer;
      text-decoration: none;
      transition: border-color 140ms ease, background 140ms ease, color 140ms ease;
    }

    button:hover:not(:disabled),
    .back-link:hover,
    .image-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .page-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    .hero,
    .toolbar,
    .page-card,
    .text-card,
    .load-error {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.06);
    }

    .hero {
      padding: 28px 32px;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .title-row,
    .toolbar,
    .toolbar-group,
    .page-card-head {
      display: flex;
      align-items: center;
    }

    .title-row {
      justify-content: space-between;
      gap: 20px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 4px;
      font-size: clamp(1.65rem, 3vw, 2.3rem);
      letter-spacing: -0.03em;
    }

    .subtitle,
    .status {
      margin-bottom: 0;
      color: var(--muted);
    }

    .back-link,
    .image-link,
    button {
      padding: 9px 14px;
    }

    .toolbar {
      justify-content: space-between;
      gap: 16px;
      margin: 18px 0;
      padding: 14px 16px;
    }

    .toolbar-group {
      flex-wrap: wrap;
      gap: 8px;
    }

    .page-input {
      width: 82px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--paper);
      text-align: center;
    }

    .status {
      min-height: 1.6em;
      margin: 0 4px 14px;
    }

    .status.error,
    .image-error {
      color: var(--danger);
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
      align-items: start;
      gap: 18px;
    }

    .page-card,
    .text-card {
      min-width: 0;
      padding: 20px;
    }

    .page-card-head {
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .page-card-head h2,
    .text-card h2 {
      margin-bottom: 0;
      font-size: 1.05rem;
    }

    .image-frame {
      min-height: 420px;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #eef2f6;
    }

    .page-image {
      display: block;
      width: min(100%, 720px);
      height: auto;
      border: 1px solid #cbd5e1;
      background: #fff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
    }

    .image-error {
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      background: var(--danger-soft);
    }

    .text-card {
      position: sticky;
      top: 18px;
    }

    .text-note {
      margin: 8px 0 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .page-text {
      max-height: 70vh;
      overflow: auto;
      margin: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfcfe;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 0.9rem/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    .load-error {
      padding: 20px;
      color: var(--danger);
      background: var(--danger-soft);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 820px) {
      .page-shell {
        width: min(100% - 20px, 720px);
        padding-top: 20px;
      }

      .hero {
        padding: 22px;
      }

      .title-row,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .toolbar-group {
        justify-content: space-between;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .text-card {
        position: static;
      }

      .page-text {
        max-height: 420px;
      }

      .image-frame {
        min-height: 260px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">PDF 页面级预览</p>
      <div class="title-row">
        <div>
          <h1 id="title">真题分类概率</h1>
          <p id="subtitle" class="subtitle">正在加载页面清单……</p>
        </div>
        <a class="back-link" href="index.html">返回首页</a>
      </div>
    </header>

    <section class="toolbar" aria-label="页面导航">
      <div class="toolbar-group">
        <button id="previous" type="button" disabled>上一页</button>
        <button id="next" type="button" disabled>下一页</button>
      </div>
      <div class="toolbar-group">
        <label for="page-number">跳转到第</label>
        <input id="page-number" class="page-input" type="number" min="1" step="1" inputmode="numeric" value="1" disabled>
        <span>页 <span id="page-count">/ --</span></span>
        <button id="go" type="button" disabled>跳转</button>
      </div>
    </section>

    <p id="status" class="status" role="status">正在加载页面清单……</p>

    <section id="content" class="content-grid" hidden>
      <article class="page-card">
        <div class="page-card-head">
          <h2 id="page-heading">PDF 第 1 页</h2>
          <a id="image-link" class="image-link" href="#" target="_blank" rel="noopener" hidden>打开原页图片</a>
        </div>
        <div class="image-frame">
          <img id="page-image" class="page-image" loading="lazy" alt="" hidden>
          <p id="image-error" class="image-error" role="alert" hidden></p>
        </div>
      </article>

      <aside class="text-card">
        <h2>文本层</h2>
        <p class="text-note">用于搜索和复制；分式、矩阵、上下标等数学符号请以左侧原页图片为准。</p>
        <pre id="page-text" class="page-text"></pre>
      </aside>
    </section>

    <section id="load-error" class="load-error" role="alert" hidden></section>
  </main>

  <script>
    (() => {
      "use strict";

      const manifestUrl = "past-exam-assets/trial-probability/manifest.json";
      const manifestBaseUrl = new URL(manifestUrl, document.baseURI);
      const state = { manifest: null, pages: [], currentIndex: 0 };

      const title = document.querySelector("#title");
      const subtitle = document.querySelector("#subtitle");
      const status = document.querySelector("#status");
      const loadError = document.querySelector("#load-error");
      const content = document.querySelector("#content");
      const previous = document.querySelector("#previous");
      const next = document.querySelector("#next");
      const pageNumber = document.querySelector("#page-number");
      const pageCount = document.querySelector("#page-count");
      const go = document.querySelector("#go");
      const pageHeading = document.querySelector("#page-heading");
      const pageImage = document.querySelector("#page-image");
      const imageError = document.querySelector("#image-error");
      const imageLink = document.querySelector("#image-link");
      const pageText = document.querySelector("#page-text");

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("error", isError);
      }

      function showLoadError(message) {
        loadError.textContent = message;
        loadError.hidden = false;
        setStatus("页面清单加载失败", true);
      }

      function updateNavigation() {
        const total = state.pages.length;
        const current = state.currentIndex + 1;
        previous.disabled = current <= 1;
        next.disabled = current >= total;
        pageNumber.disabled = total === 0;
        go.disabled = total === 0;
        pageNumber.min = "1";
        pageNumber.max = String(Math.max(total, 1));
        pageNumber.value = String(current);
        pageCount.textContent = `/ ${total}`;
      }

      function showImageError(message) {
        imageError.textContent = message;
        imageError.hidden = false;
        setStatus(`第 ${state.currentIndex + 1} 页图片加载失败，文本层仍可用。`, true);
      }

      function setPage(index) {
        if (!state.pages.length) return;
        state.currentIndex = Math.max(0, Math.min(index, state.pages.length - 1));
        const page = state.pages[state.currentIndex];
        const number = Number.isInteger(page.number) ? page.number : state.currentIndex + 1;

        pageHeading.textContent = `PDF 第 ${number} 页`;
        pageText.textContent = page.text || "此页没有提取到文字层，请直接查看原页图片。";
        imageError.hidden = true;
        pageImage.hidden = true;
        pageImage.removeAttribute("src");
        imageLink.hidden = true;
        imageLink.removeAttribute("href");

        if (page.image) {
          const imageUrl = new URL(page.image, manifestBaseUrl).href;
          pageImage.alt = `PDF 第 ${number} 页原始页面`;
          pageImage.src = imageUrl;
          pageImage.hidden = false;
          imageLink.href = imageUrl;
          imageLink.hidden = false;
        } else {
          showImageError("此页没有生成原页图片；请使用右侧文本层或源 PDF。", false);
        }

        updateNavigation();
        setStatus(`当前第 ${number} 页，共 ${state.pages.length} 页。`);
      }

      function requestedPageIndex() {
        const value = Number.parseInt(pageNumber.value, 10);
        if (!Number.isFinite(value)) return state.currentIndex;
        return Math.max(1, Math.min(value, state.pages.length)) - 1;
      }

      previous.addEventListener("click", () => setPage(state.currentIndex - 1));
      next.addEventListener("click", () => setPage(state.currentIndex + 1));
      go.addEventListener("click", () => setPage(requestedPageIndex()));
      pageNumber.addEventListener("keydown", (event) => {
        if (event.key === "Enter") setPage(requestedPageIndex());
      });
      pageImage.addEventListener("error", () => {
        showImageError("原页图片加载失败。请检查静态资源路径；右侧文本层仍可搜索和复制。", true);
      });
      document.addEventListener("keydown", (event) => {
        if (event.target === pageNumber) return;
        if (event.key === "ArrowLeft") setPage(state.currentIndex - 1);
        if (event.key === "ArrowRight") setPage(state.currentIndex + 1);
      });

      fetch(manifestUrl, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((manifest) => {
          if (!manifest || !Array.isArray(manifest.pages) || manifest.pages.length === 0) {
            throw new Error("manifest.pages 为空或格式不正确");
          }

          state.manifest = manifest;
          state.pages = manifest.pages.map((page, index) => ({
            number: Number.isInteger(page.number) ? page.number : index + 1,
            text: typeof page.text === "string" ? page.text : "",
            image: typeof page.image === "string" && page.image ? page.image : null
          }));
          title.textContent = typeof manifest.title === "string" ? manifest.title : "PDF 原页预览";
          subtitle.textContent = `共 ${state.pages.length} 页 · 文本层用于检索，原页图片用于数学公式显示`;
          content.hidden = false;
          loadError.hidden = true;
          setPage(0);
        })
        .catch((error) => {
          showLoadError(`无法加载页面清单：${error.message}。请确认 public/past-exam-assets/trial-probability/manifest.json 已发布。`);
        });
    })();
  </script>
</body>
</html>
